services:
  app:
    build: .
    container_name: hotel-app
    restart: unless-stopped
    ports: ["3004:80"]
    environment:
      - APP_NAME=HotelResortERP
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://100.77.117.2:3004
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=hotel_resort_erp
      - DB_USERNAME=hotel
      - DB_PASSWORD=${DB_PASSWORD:-hotel_secret_2026}
    volumes: [app_storage:/var/www/storage]
    depends_on: { mysql: { condition: service_healthy } }
    networks: [hotel-network]

  mysql:
    image: mysql:8.4
    container_name: hotel-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_secret_2026}
      - MYSQL_DATABASE=hotel_resort_erp
      - MYSQL_USER=hotel
      - MYSQL_PASSWORD=${DB_PASSWORD:-hotel_secret_2026}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck: { test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [hotel-network]

volumes:
  app_storage:
  mysql_data:

networks:
  hotel-network: { driver: bridge }